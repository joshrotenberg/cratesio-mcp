# Fly.io configuration for cratesio-mcp
# Deploy with: fly deploy

app = "cratesio-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the single machine always-on (no idle auto-stop/suspend). When the app
  # is briefly down, real client traffic backs off, so a freshly-deployed machine
  # is immediately idle -- auto-stop then stops it before traffic returns, leaving
  # zero serving machines (the HTTP 000 outage we hit). For a small always-on
  # service this lifecycle churn isn't worth it; just keep the machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  # Run exactly ONE machine. MCP sessions are held in-memory per instance with
  # no shared session store and no session-sticky routing, so a second machine
  # scatters same-session requests across instances that don't share state and
  # the first post-initialize request fails with -32600 (#147). Note this key is
  # a floor, not a cap: `fly launch` creates 2 machines by default and this line
  # will not remove the extra one. Keep the count at 1 with `fly scale count 1`;
  # only scale past 1 after adding a shared SessionStore or stateless mode.
  min_machines_running = 1
  processes = ["app"]
  [http_service.concurrency]
    # Final-protocol subscriptions/listen responses remain open indefinitely.
    # Use one backend connection per HTTP request so Fly Proxy cannot pool a
    # follow-up request behind the long-lived SSE response (#157).
    #
    # These limits count OPEN CONNECTIONS, not in-flight requests, so idle
    # keep-alive connections the proxy pools count against them. Real traffic
    # holds ~35 pooled connections at steady state, so the previous 35/25 was
    # at capacity permanently: the proxy had no routable candidate and served
    # PR01 "no known healthy instances" for every request while the machine sat
    # at load 0.00 (#158). The flyd health check runs on the private network and
    # bypasses proxy concurrency accounting, so it kept reporting "passing"
    # throughout. Idle connections cost a few KB each, so headroom is cheap;
    # keep these an order of magnitude above observed steady-state concurrency.
    type = "connections"
    hard_limit = 400
    soft_limit = 300

  # Fly-managed HTTP health check on /health. A failing check makes a deploy
  # fail (instead of "succeeding" while the app serves nothing -- the gap that
  # hid the v0.2.0 outage) and stops the proxy routing to an unhealthy machine.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
