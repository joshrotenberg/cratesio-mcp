name: Deploy to Fly.io

on:
  # Deploy only when a release is cut: release-plz pushes a v{MAJOR}.{MINOR}.{PATCH}
  # tag (git_tag_enable in release-plz.toml), which is the same signal cargo-dist's
  # release.yml uses. This keeps the live server on the latest released version and
  # avoids bouncing the machine (and wiping in-memory MCP sessions, see #93/#97) on
  # every merge to main. Use the manual workflow_dispatch run for hotfix deploys.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: github.repository == 'joshrotenberg/cratesio-mcp'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Reap stale machines
        run: |
          # Only reap genuinely-stale machines (stopped/suspended leftovers).
          # NOT `state != "started"` -- with --strategy immediate the freshly
          # deployed machine is briefly in "created"/"replacing" state when this
          # runs, and the broad filter destroyed it, leaving zero machines (an
          # HTTP 000 outage). With auto_stop = "off" there should be none anyway.
          echo "Destroying any stopped/suspended machines left from the deploy..."
          flyctl machines list --json | jq -r '.[] | select(.state == "stopped" or .state == "suspended") | .id' | xargs -I{} flyctl machines destroy {} --force || true
          echo "Active machines after reap:"
          flyctl machines list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment (health check)
        run: |
          echo "Waiting for server to be ready..."
          MAX_RETRIES=6
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            # Tolerate transient connect/TLS errors while the machine comes up
            # (a single early curl false-failed the v0.2.0 release run).
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://cratesio-mcp.fly.dev/health || echo "000")
            echo "Attempt $attempt/$MAX_RETRIES: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep $RETRY_DELAY
          done
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1

  validate:
    name: Validate released MCP API
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'joshrotenberg/cratesio-mcp'
    env:
      MCP_ENDPOINT: https://cratesio-mcp.fly.dev/
      MCP_REPL_VERSION: "0.1.7"
      MCP_TYPESCRIPT_CLIENT_VERSION: "2.0.0"
      EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mcp-repl
        run: cargo install mcp-repl --version "$MCP_REPL_VERSION" --locked

      - name: Install official TypeScript MCP client
        run: >-
          npm install --no-save --no-package-lock --no-audit --no-fund
          "@modelcontextprotocol/client@$MCP_TYPESCRIPT_CLIENT_VERSION"

      - name: Validate released server
        run: bash scripts/validate-release.sh
